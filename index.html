<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#07145C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Memora">

    <title>Memora</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" type="image/png" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>

<body>

    <header class="app-header">
        <img src="icons/icon-192.png" alt="Memora" class="app-icon">

        <div>
            <h1>Memora</h1>
            <p>Remember what you recorded.</p>
        </div>
    </header>

    <main class="app-main">

        <section class="panel">
            <h2>Recordings</h2>

            <div class="action-row">
                <button id="sourceButton" type="button">
                    Select Recordings
                </button>

                <button id="destinationButton" type="button">
                    Select Destination
                </button>
            </div>

            <input
                id="fileInput"
                type="file"
                multiple
                hidden
            >

            <div id="recordings" class="recordings">
                <p class="empty-message">
                    No recordings selected.
                </p>
            </div>
        </section>


        <section class="panel">
            <h2>Transcription</h2>

            <div class="transcription-controls">

                <label for="modelSelect">
                    Model
                </label>

                <select id="modelSelect">
                    <option value="tiny">Tiny — fastest</option>
                    <option value="base">Base — fast</option>
                    <option value="small" selected>Small — balanced</option>
                    <option value="medium">Medium — higher accuracy</option>
                    <option value="large-v3">
                        Large-v3 — highest accuracy
                    </option>
                </select>

                <button id="transcribeButton" type="button">
                    Transcribe 
                </button>

            </div>

            <div id="transcriptionStatus" class="transcription-status">
                No transcription started.
            </div>

            <div id="transcriptionOutput" class="transcription-output">
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.4/dist/mp4box.all.min.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
