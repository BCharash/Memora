<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#07145C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Memora">

    <title>Memora</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" type="image/png" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>

<body>

    <header class="app-header">
        <img src="icons/icon-192.png" alt="Memora" class="app-icon">

        <div>
            <h1>Memora</h1>
            <p>Remember what you recorded.</p>
        </div>
    </header>

    <main class="app-main">

        <nav class="app-tabs" aria-label="Memora sections">

            <button
                id="transcriptionTab"
                class="app-tab active"
                type="button"
                aria-selected="true"
            >
                Transcription
            </button>

            <button
                id="combineTab"
                class="app-tab"
                type="button"
                aria-selected="false"
            >
                Combine Files
            </button>

        </nav>


        <section
            id="transcriptionPanel"
            class="tab-panel"
        >

            <section class="panel">

                <div class="source-section">

                    <h2>Source</h2>

                    <div class="action-row">
                        <button id="sourceButton" type="button">
                            Select Source Folder
                        </button>
                    </div>

                </div>


                <div class="destination-section">

                    <h2>Destination</h2>

                    <div class="destination-options">

                        <button
                            id="sourceDestinationButton"
                            type="button"
                        >
                            Use Source Folder
                        </button>

                        <button
                            id="transcriptionDestinationButton"
                            type="button"
                        >
                            Create "transcription" Subfolder
                        </button>

                        <button
                            id="destinationButton"
                            type="button"
                        >
                            Browse for Another Folder
                        </button>

                    </div>

                </div>


                <div class="recordings-section">

                    <h2>Recordings</h2>

                    <div id="recordings" class="recordings">
                        <p class="empty-message">
                            No recordings selected.
                        </p>
                    </div>

                </div>

            </section>


            <section class="panel">

                <h2>Transcription</h2>

                <div class="transcription-controls">

                    <label for="modelSelect">
                        Model
                    </label>

                    <select id="modelSelect">
                        <option value="tiny">Tiny — fastest</option>
                        <option value="base">Base — fast</option>
                        <option value="small" selected>
                            Small — balanced
                        </option>
                        <option value="medium">
                            Medium — higher accuracy
                        </option>
                        <option value="large-v3">
                            Large-v3 — highest accuracy
                        </option>
                    </select>

                    <label for="languageSelect">
                        Language
                    </label>

                    <select id="languageSelect">
                        <option value="">Auto-detect</option>
                        <option value="en">English</option>
                        <option value="pt">Portuguese</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="sa">Sanskrit</option>
                    </select>

                    <label for="operationSelect">
                        Operation
                    </label>

                    <select id="operationSelect">
                        <option value="transcribe" selected>
                            Transcribe
                        </option>
                        <option value="translate">
                            Translate to English
                        </option>
                    </select>

                    <button id="transcribeButton" type="button">
                        Transcribe Selected
                    </button>

                </div>

                <div
                    id="transcriptionStatus"
                    class="transcription-status"
                >
                    No transcription started.
                </div>

                <div
                    id="transcriptionOutput"
                    class="transcription-output"
                >
                </div>

            </section>

        </section>


        <section
            id="combinePanel"
            class="tab-panel"
            hidden
        >

            <section class="panel">

                <div class="source-section">

                    <h2>Text Source</h2>

                    <div class="action-row">
                        <button
                            id="textSourceButton"
                            type="button"
                        >
                            Select Text Source Folder
                        </button>
                    </div>

                </div>


                <div class="recordings-section">

                    <h2>Transcripts</h2>

                    <div id="transcripts" class="recordings">

                        <p class="empty-message">
                            No transcript files selected.
                        </p>

                    </div>

                </div>


                <div class="destination-section">

                    <h2>Output</h2>

                    <div class="destination-options">

                        <button
                            id="combineSourceDestinationButton"
                            type="button"
                        >
                            Use Source Folder
                        </button>

                        <button
                            id="combineFolderDestinationButton"
                            type="button"
                        >
                            Create "Combined" Folder
                        </button>

                        <button
                            id="combineDestinationButton"
                            type="button"
                        >
                            Browse for Another Folder
                        </button>

                    </div>

                </div>


                <div class="combine-title">

                    <label for="combineTitleInput">
                        Combined document title
                    </label>

                    <input
                        id="combineTitleInput"
                        type="text"
                        value="Memora — Combined Transcription"
                        aria-label="Combined document title"
                    >

                </div>


                <div class="combine-actions">

                    <button
                        id="combineTextButton"
                        type="button"
                    >
                        Create Combined TXT
                    </button>

                    <button
                        id="combineDOCXButton"
                        type="button"
                    >
                        Create Combined DOCX
                    </button>

                    <button
                        id="combineHTMLButton"
                        type="button"
                    >
                        Create Combined HTML
                    </button>

                </div>

                <div
                    id="combineStatus"
                    class="transcription-status"
                >
                    No combination started.
                </div>

            </section>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.4/dist/mp4box.all.min.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
